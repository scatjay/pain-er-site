<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>共同提案牆</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
/* 風格沿用 proposal.html／storyboard.html 的 :root：粗黑框、手繪圓角、網點背景；顏色全用變數，亮暗兩套 */
:root{--bg:#eaf4fb;--dot:#cfe3f1;--panel:#fff;--fg:#1e1e1e;--muted:#59656d;--ink:#1e1e1e;--pop:#ff6b4a;--yellow:#ffd43b;--mint:#b2f2bb;--sky:#a5d8ff;--bad:#c92a2a;--ok:#1b5e2c;--line:#cfd8de;--bw:3px;--bw-s:2px;--r-m:10px;--sh:3px;--sh-l:6px;--ct:#3d6fe0;--soft-y:color-mix(in srgb,var(--yellow) 26%,var(--panel));--soft-r:color-mix(in srgb,var(--pop) 16%,var(--panel));--soft-g:color-mix(in srgb,var(--mint) 38%,var(--panel))}
@media (prefers-color-scheme:dark){:root{--bg:#10191f;--dot:#1b2a33;--panel:#18262e;--fg:#e8eff2;--muted:#9fb0b9;--ink:#e8eff2;--pop:#ff8a70;--yellow:#e0b82a;--mint:#2f6b3f;--sky:#2a557a;--bad:#ff8787;--ok:#69db7c;--line:#2c3f4a;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1.5px,transparent 1.5px);background-size:18px 18px;color:var(--fg);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
button,.btn{background:var(--yellow);color:#1e1e1e;border:var(--bw) solid var(--ink);border-radius:var(--r-m);padding:6px 14px;font:inherit;font-weight:700;cursor:pointer;box-shadow:var(--sh) var(--sh) 0 var(--ink);text-decoration:none;display:inline-block}
button.mini,.btn.mini{padding:1px 10px;font-size:13px;border-width:2px;box-shadow:2px 2px 0 var(--ink);margin:2px 0;min-height:32px}
button.g{background:var(--panel);color:var(--fg)}
button.big{min-height:48px;padding:6px 18px;font-size:16px}
button.armed{background:var(--pop)}
button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:var(--bw) solid var(--pop);outline-offset:2px}
input,select,textarea{font:inherit;color:inherit;background:var(--panel);border:var(--bw-s) solid var(--ink);border-radius:var(--r-m);padding:4px 8px;width:100%}
textarea{resize:vertical;min-height:70px}
h1{font-size:22px;margin:0;font-weight:900}h2{font-size:17px;margin:4px 0 6px;font-weight:900}h3{font-size:15px;margin:10px 0 4px;font-weight:900}
.muted{color:var(--muted);font-size:13px}
label,.lbl{display:block;font-size:13px;font-weight:700;margin-top:8px}
.card{background:var(--panel);border:var(--bw) solid var(--ink);border-radius:var(--r-m);padding:12px 14px;box-shadow:var(--sh-l) var(--sh-l) 0 var(--ink);margin-bottom:14px}
#gate{max-width:560px;margin:60px auto;padding:0 16px}
#top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:var(--bw) solid var(--ink);border-top:8px solid var(--ct);padding:8px 16px}
#top .line{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#lvBar{display:flex;gap:6px;align-items:center;margin-top:6px}
.lvb{min-height:40px;border:2px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);box-shadow:none;padding:0 14px}
.lvb.on{background:var(--ct);color:#fff;border-color:var(--ct)}
#lobby{max-width:560px;margin:16px auto;padding:0 16px}
#wallView{max-width:1400px;margin:0 auto;padding:12px 16px}
.hl{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.code{font-family:ui-monospace,Consolas,monospace;letter-spacing:.14em;background:var(--soft-y);border:2px solid var(--ink);border-radius:8px;padding:0 10px}
.rbadge{border:2px solid var(--ink);border-radius:99px;padding:0 10px;font-size:13px;font-weight:700;background:var(--panel)}
.rbadge.host{background:var(--soft-y)}.rbadge.member{background:var(--soft-g)}.rbadge.pending,.rbadge.spectator{background:var(--soft-r)}
.mchips{margin-top:6px}
.mchip{display:inline-block;border:2px solid var(--ink);border-radius:99px;padding:0 10px;margin:2px 4px 2px 0;font-size:13px;background:var(--panel)}
.mchip.host{background:var(--soft-y)}.mchip.me{font-weight:900}
.banner{background:var(--soft-y);border:var(--bw-s) solid var(--ink);border-radius:var(--r-m);padding:8px 12px;margin-bottom:12px;font-weight:700}
.sum{font-weight:900;cursor:pointer;min-height:40px;display:flex;align-items:center}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
#inviteText{min-height:96px;font-size:14px}
.reqrow,.opnrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;border-bottom:1px dashed var(--line);padding:6px 0}
#layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
#side{min-width:0}
#stage{min-width:0}
#canvasWrap{position:relative;height:calc(100vh - 190px);min-height:560px;border:var(--bw) solid var(--ink);border-radius:var(--r-m);box-shadow:var(--sh-l) var(--sh-l) 0 var(--ink);background:#fffdf5;overflow:hidden}
#cv{position:absolute;inset:0}
#canvasMsg{position:absolute;left:12px;top:12px;z-index:3;background:var(--panel);border:2px solid var(--ink);border-radius:8px;padding:2px 10px;color:var(--fg)}
#fitBtn{position:absolute;right:12px;top:12px;z-index:3}
/* Excalidraw 精簡：只留縮放與平移（頂端工具列、屬性面板、說明、選單全藏起來） */
#cv .App-menu_top,#cv .App-toolbar,#cv .App-menu__left,#cv .main-menu-trigger,#cv .help-icon,#cv .layer-ui__wrapper__top-right,#cv .welcome-screen-center,#cv .welcome-screen-decor,#cv .undo-redo-buttons,#cv .sidebar-trigger,#cv .selected-shape-actions,#cv .layer-ui__wrapper__footer-right,#cv .Stats,#cv .encrypted-icon{display:none!important}
.tps{display:flex;gap:6px;flex-wrap:wrap}
.tp{min-height:44px;border:2px solid var(--ink);border-radius:10px;background:var(--tc,#eee);color:#1e1e1e;box-shadow:none;padding:0 12px;font-size:15px}
.tp.on{outline:3px solid var(--pop);outline-offset:1px}
.tp-note{font-size:17px;box-shadow:2px 2px 0 var(--ink)}
.selcard{border:2px solid var(--ink);border-left-width:10px;border-radius:8px;padding:6px 10px;background:var(--panel);overflow-wrap:anywhere;margin:6px 0}
.okb{color:var(--ok);font-weight:700}
.ach{display:inline-block;border:2px solid var(--line);border-radius:99px;padding:0 10px;margin:2px 4px 2px 0;font-size:13px;background:var(--panel);color:var(--muted)}
.ach.got{border-color:var(--ink);background:var(--soft-g);color:var(--fg);font-weight:700}
.mtabs{display:flex;gap:6px;margin-bottom:10px}
.mtab{flex:1;min-height:48px;padding:0 4px;border:2px solid var(--ink);border-radius:10px;background:var(--panel);color:var(--fg);box-shadow:none;font-size:16px}
.mtab.on{background:var(--ct);color:#fff}
.mcard{background:var(--panel);border:2px solid var(--ink);border-left-width:12px;border-radius:10px;padding:10px 12px;margin-bottom:10px;overflow-wrap:anywhere}
.mcard .mh{font-size:14px}.mcard .mt{font-size:16px;margin:4px 0}
.mcard a{display:inline-block;min-height:48px;line-height:48px;font-weight:700}
.empty{padding:20px 4px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}
#toast.on{opacity:1}
#copyTmp{position:fixed;left:-999px;top:0;width:10px;height:10px}
#openComposer{display:none}
@media (max-width:860px){
  html,body{overflow-x:hidden;max-width:100vw}
  #top{position:static;padding:8px 10px}h1{font-size:18px}
  #wallView{padding:8px}
  #layout{grid-template-columns:minmax(0,1fr)}
  #stage{order:1}#side{order:2}
  button,.btn,select{min-height:48px}
  button.mini,.btn.mini{min-height:48px;padding:8px 14px;font-size:16px;min-width:48px}
  input,select,textarea{font-size:16px;min-height:48px}textarea{min-height:90px}
  .tp{min-height:48px;font-size:16px}
  .lvb{min-height:48px;font-size:16px}
  #openComposer{display:block;width:100%;margin-bottom:10px}
  #composerBox{display:none}
  body.cmp-open #composerBox{display:block}
  #toast{bottom:84px}
}
</style>
</head>
<body>
<div id="gate"><div class="card"><h1>載入中…</h1></div></div>
<div id="app" hidden>
  <div id="top">
    <div class="line">
      <h1>共同提案牆</h1><span class="muted">衛教簡訊再設計・呼呼醫院</span><span id="sidLine" class="muted"></span><span id="modeTag" class="muted"></span>
      <span style="flex:1"></span>
      <a id="proposalLink" class="btn mini" href="proposal.html">📝 回提案室</a>
    </div>
    <div id="lvBar"></div>
  </div>
  <section id="lobby" hidden></section>
  <section id="wallView" hidden>
    <div class="card" id="head"></div>
    <div id="banner"></div>
    <details class="card" id="inviteBox" hidden>
      <summary class="sum">邀請同學（複製連結和代碼傳給他們）</summary>
      <div class="muted">把下面這段傳給同學（連結和代碼都在裡面）。同學打開連結、登入後，這裡會出現「某某想加入」，你按一次同意就好。一面牆最多 4 位同學，第 5 位只能旁觀。</div>
      <textarea id="inviteText" readonly aria-label="邀請連結和代碼"></textarea>
      <div class="bar"><button class="big" data-act="copyinvite" id="copyInvite">📋 複製邀請連結和代碼</button></div>
      <div id="manualAdd"><label for="manualSid">同學按了沒反應？直接輸入他的學號加進來</label><div class="bar"><input id="manualSid" maxlength="20" placeholder="學號" style="flex:1;min-width:140px"><button class="big g" data-act="manualadd">加進來</button></div></div>
      <div id="inviteFull" class="muted" hidden>這面牆已經有 4 位同學了，其他同學只能旁觀。</div>
    </details>
    <div class="card" id="reqBox" hidden></div>
    <button class="big" id="openComposer" data-act="opencmp" hidden>＋ 貼一張卡</button>
    <div id="layout">
      <aside id="side">
        <div class="card" id="composerBox" hidden></div>
        <div class="card" id="selBox" hidden></div>
        <div class="card" id="opnBox" hidden></div>
        <div class="card" id="achBox" hidden></div>
        <div class="card" id="adoptBox" hidden></div>
      </aside>
      <main id="stage">
        <div id="canvasWrap" hidden><div id="canvasMsg" hidden></div><button class="mini g" id="fitBtn" data-act="fit">看全部</button><div id="cv"></div></div>
        <div id="mobile" hidden></div>
      </main>
    </div>
  </section>
</div>
<textarea id="copyTmp" hidden aria-hidden="true" tabindex="-1"></textarea>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="er_firebase.js?v=202611040800"></script>
<script src="sb_core.js?v=202611040800"></script>
<script src="sb_store.js?v=202611040800"></script>
<script src="proposal_core.js?v=202611040800"></script>
<script src="proposal_proto.js?v=202611040800"></script>
<script src="proposal_store.js?v=202611040800"></script>
<script src="ui_level.js?v=202611040800"></script>
<script src="proposal_wall.js?v=202611041400"></script>
<script src="wall_store.js?v=202611041400"></script>
<script src="wall_ui.js?v=202611041400"></script>
</body>
</html>
