<!doctype html><meta charset="utf-8"><title>角色總覽</title>
<body style="margin:0;background:#f8f9fa;font:14px sans-serif"><div id="g" style="display:flex;flex-wrap:wrap;gap:6px;padding:10px"></div>
<script src="personas.js"></script><script src="chars.js"></script><script src="avatar.js"></script>
<script>
var g=document.getElementById('g');
ERG_PERSONAS.PERSONAS.forEach(function(p,i){var d=document.createElement('div');d.style.cssText='background:#fff;border:2px solid #ccc;border-radius:8px;padding:4px;text-align:center;width:110px';
 d.innerHTML=ERG_CHARS.character(p.look,{seed:i*7+3,label:p.name,mood:['idle','busy','angry','sleepy','waiting'][i%5],size:1.2})+'<div style="font-size:11px;color:#555">'+p.title.slice(0,10)+'</div>';g.appendChild(d)});

/* 11-04 階段造型：起始角色 → 階段 2~6，每階段都換剪影 */
(function(){var AV=ERG_AVATAR,base=AV.PRESETS[0].look,h=document.createElement('div');h.id='stageRow';h.style.cssText='padding:10px;border-top:2px solid #ccc';
 var cells=[{n:'階段 1 起始',l:base}].concat(AV.stageLooks(6).map(function(g){return{n:'階段 '+g.stage+' '+g.name,l:AV.applyStage(base,g.id)}}));
 h.innerHTML='<div style="font-weight:900;margin-bottom:6px">階段造型（同一張臉，逐階段套上）</div><div style="display:flex;flex-wrap:wrap;gap:6px">'+cells.map(function(c,i){return '<div style="background:#fff;border:2px solid #ccc;border-radius:8px;padding:4px;text-align:center;width:130px">'+ERG_CHARS.character(AV.toCharLook(c.l),{seed:5,label:c.n.split(" ")[0]+" "+c.n.split(" ")[1],size:1.3})+'<div style="font-size:11px;color:#555">'+(c.n.split(" ")[2]||"")+'</div></div>'}).join('')+'</div>';
 document.body.appendChild(h);})();
</script>
