<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 助教</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
/* 學習單的「只有助教」頁（11-24）：?unit=單元代號。風格沿用提案室（粗黑框、網點背景、亮暗兩套）；手機優先，按鈕與輸入框高度 ≥48px、字 ≥16px。 */
:root{--bg:#eaf4fb;--dot:#cfe3f1;--panel:#fff;--fg:#1e1e1e;--muted:#59656d;--ink:#1e1e1e;--pop:#ff6b4a;--yellow:#ffd43b;--mint:#b2f2bb;--sky:#a5d8ff;--bad:#c92a2a;--ok:#1b5e2c;--line:#cfd8de;--ct:#3d6fe0;--soft-y:#fff3bf;--soft-b:#dbe8fb;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#10191f;--dot:#1b2a33;--panel:#18262e;--fg:#e8eff2;--muted:#9fb0b9;--ink:#e8eff2;--pop:#ff8a70;--yellow:#e0b82a;--mint:#2f6b3f;--sky:#2a557a;--bad:#ff8787;--ok:#69db7c;--line:#2c3f4a;--soft-y:#3d3515;--soft-b:#1c2c44}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1.5px,transparent 1.5px);background-size:18px 18px;color:var(--fg);font:16px/1.65 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
main{max-width:720px;margin:0 auto;padding:16px 0}
.card{background:var(--panel);border:3px solid var(--ink);border-top:8px solid var(--ct);border-radius:10px;padding:14px 16px;box-shadow:5px 5px 0 var(--ink);margin-bottom:16px}
h1{font-size:20px;line-height:1.4;margin:0 0 6px;font-weight:900}
h2{font-size:16px;margin:0 0 8px;font-weight:900}
.muted{color:var(--muted);font-size:14px}
.banner{background:var(--soft-y);border:2px solid var(--ink);border-radius:10px;padding:8px 12px;margin:8px 0 0;font-weight:700}
button,.btn{background:var(--yellow);color:#1e1e1e;border:3px solid var(--ink);border-radius:10px;padding:8px 14px;min-height:48px;font:inherit;font-weight:700;cursor:pointer;box-shadow:3px 3px 0 var(--ink);text-decoration:none;display:inline-flex;align-items:center}
button:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
button:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
.quick{display:flex;flex-direction:column;gap:10px}
.quick button{background:var(--sky);color:var(--fg);justify-content:flex-start;text-align:left;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel);color:var(--fg);border:2px solid var(--ink);border-radius:99px;padding:6px 14px;min-height:44px;box-shadow:none;font-weight:400;text-align:left}
select,textarea{font:inherit;color:var(--fg);background:var(--panel);border:3px solid var(--ink);border-radius:10px;padding:8px 10px;width:100%;min-height:48px}
textarea{resize:vertical;min-height:90px}
label.lb{display:block;font-weight:700;margin:12px 0 4px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
#log{display:flex;flex-direction:column;gap:12px}
.q,.a{border:2px solid var(--ink);border-radius:10px;padding:8px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.q{background:var(--soft-b);align-self:flex-end;max-width:92%}
.a{background:var(--panel);align-self:flex-start;max-width:100%}
.a.warn{background:var(--soft-y)}
.a b,.q b{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.empty{color:var(--muted)}
#gate{max-width:560px;margin:60px auto}
.nudge{margin:8px 0;padding:6px 10px;border-left:4px solid var(--ct);background:var(--soft-y)}
a{color:var(--ct)}
</style>
</head>
<body>
<div id="gate"><div class="card"><h1>載入中…</h1></div></div>
<main id="app" hidden>
  <section class="card" id="head">
    <h1 id="title">AI 助教</h1>
    <div class="banner" id="banner"></div>
    <div class="muted" id="sidLine" style="margin-top:6px"></div>
  </section>
  <section class="card" id="quickCard">
    <h2 id="quickTitle">我還沒做，從頭帶我</h2>
    <div class="quick" id="quick"></div>
  </section>
  <section class="card">
    <h2>問助教</h2>
    <label class="lb" for="step">我現在做到哪一步（不確定可以不選）</label>
    <select id="step"></select>
    <label class="lb">點一個問題放進輸入框，再按「問」</label>
    <div class="chips" id="sug"></div>
    <div id="uNudge"></div>
    <label class="lb" for="ask">也可以自己打問題（300 字內，不要寫電話或姓名）</label>
    <textarea id="ask" maxlength="300" placeholder="例如：我卡在這一步，畫面長這樣…"></textarea>
    <div class="bar"><button id="send" type="button">問</button><span class="muted" id="left"></span></div>
  </section>
  <section class="card" id="logCard">
    <h2>助教的回答</h2>
    <div id="log" role="log" aria-live="polite"><div class="empty">還沒有問題。點上面的問題，或自己打。</div></div>
  </section>
  <p class="muted"><a id="back" href="#">回到學習單</a>　<a id="lobby" href="index.html">回急診室</a></p>
</main>
<div id="toast" role="status" aria-live="polite" style="position:fixed;left:16px;right:16px;bottom:16px;max-width:560px;margin:0 auto;background:var(--ink);color:var(--panel);border-radius:10px;padding:10px 14px;display:none;z-index:9"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="er_firebase.js?v=202611242207"></script>
<script src="sb_core.js?v=202611242207"></script>
<script src="sb_store.js?v=202611242207"></script>
<script src="proposal_core.js?v=202611242207"></script>
<script src="proposal_store.js?v=202611242207"></script>
<script src="tutor_units_data.js?v=202611242207"></script>
<script src="unit_coach.js?v=202611242207"></script>
<script src="ta.js?v=202611242207"></script>
</body>
</html>
