<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提案室</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
/* 風格沿用 index.html／storyboard.html 的 :root：粗黑框、手繪圓角、網點背景；顏色全用變數，亮暗兩套。主色 --ct 由 case_tone.js 的「離院衛教簡訊」靛藍帶入 */
:root{--bg:#eaf4fb;--dot:#cfe3f1;--panel:#fff;--fg:#1e1e1e;--muted:#59656d;--ink:#1e1e1e;--pop:#ff6b4a;--yellow:#ffd43b;--mint:#b2f2bb;--sky:#a5d8ff;--bad:#c92a2a;--ok:#1b5e2c;--line:#cfd8de;--bw:3px;--bw-s:2px;--r-m:10px;--r-hand:5px 7px 2px 2px;--sh:3px;--sh-l:6px;--ct:#3d6fe0;--soft-y:color-mix(in srgb,var(--yellow) 26%,var(--panel));--soft-r:color-mix(in srgb,var(--pop) 16%,var(--panel));--soft-g:color-mix(in srgb,var(--mint) 38%,var(--panel))}
@media (prefers-color-scheme:dark){:root{--bg:#10191f;--dot:#1b2a33;--panel:#18262e;--fg:#e8eff2;--muted:#9fb0b9;--ink:#e8eff2;--pop:#ff8a70;--yellow:#e0b82a;--mint:#2f6b3f;--sky:#2a557a;--bad:#ff8787;--ok:#69db7c;--line:#2c3f4a;color-scheme:dark}}
.tabs button{color:var(--fg)}@media (prefers-color-scheme:dark){span.chip,button.chip,.chip .x{color:var(--fg)}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1.5px,transparent 1.5px);background-size:18px 18px;color:var(--fg);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
button,.btn{background:var(--yellow);color:#1e1e1e;border:var(--bw) solid var(--ink);border-radius:var(--r-m);padding:6px 14px;font:inherit;font-weight:700;cursor:pointer;box-shadow:var(--sh) var(--sh) 0 var(--ink);text-decoration:none;display:inline-block}
button.mini,.btn.mini{padding:1px 8px;font-size:12px;border-width:2px;box-shadow:2px 2px 0 var(--ink);margin:2px 0}
button.armed{background:var(--pop)}
button:disabled,.btn.dis{opacity:.45;cursor:not-allowed;box-shadow:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:var(--bw) solid var(--pop);outline-offset:2px}
input,select,textarea{font:inherit;color:inherit;background:var(--panel);border:var(--bw-s) solid var(--ink);border-radius:var(--r-m);padding:4px 8px;width:100%}
textarea{resize:vertical;min-height:54px}
h1{font-size:22px;margin:0;font-weight:900}h2{font-size:17px;margin:4px 0 6px;font-weight:900}h3{font-size:14px;margin:12px 0 4px;font-weight:900}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--panel);border:var(--bw) solid var(--ink);border-radius:var(--r-m);padding:14px 16px;box-shadow:var(--sh-l) var(--sh-l) 0 var(--ink);margin-bottom:16px}
#gate{max-width:560px;margin:60px auto;padding:0 16px}
#top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:var(--bw) solid var(--ink);border-top:8px solid var(--ct);padding:8px 16px}
#top .line{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#nextLine{flex:1 1 100%;background:var(--soft-y);border:var(--bw-s) solid var(--ink);border-radius:var(--r-m);padding:6px 12px;font-size:16px;font-weight:700;margin-top:6px}
#nextLine .nl{background:var(--ct);color:#fff;border-radius:99px;padding:0 10px;font-size:13px;margin-right:6px}
#progress{flex:1 1 100%;margin-top:4px}
.pchip{display:inline-block;border:var(--bw-s) solid var(--ink);border-radius:99px;padding:0 10px;margin:2px 4px 2px 0;font-size:12px;font-weight:700;background:var(--panel)}
.pchip.ok{background:var(--soft-g);color:var(--fg)}.pchip.bad{background:var(--soft-r);color:var(--fg)}
#layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;max-width:1300px;margin:0 auto;padding:16px}
aside{align-self:start;position:sticky;top:160px;max-height:calc(100vh - 176px);overflow:auto}
.cl{display:inline-block;color:#fff;border:2px solid var(--ink);border-radius:6px;min-width:22px;text-align:center;font-weight:900;margin-right:6px;padding:0 4px;font-style:normal;font-size:11px}
.dirs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:8px 0}
.dirbtn{text-align:left;background:var(--panel);color:var(--fg);box-shadow:none;display:flex;flex-direction:column;gap:2px;padding:8px 12px}
.dirbtn span{font-weight:400;font-size:12px;color:var(--muted)}
.dirbtn.on{background:var(--ct);color:#fff}.dirbtn.on span{color:#fff}
.hist{margin-top:8px;font-size:13px}.hrow{padding:2px 0;border-bottom:1px dashed var(--line)}
.rowc{border:var(--bw) solid var(--ink);border-top:8px solid var(--ct);border-radius:var(--r-m);padding:10px 12px;margin:14px 0;background:var(--panel);box-shadow:var(--sh-l) var(--sh-l) 0 var(--ink)}
.rowc header{display:flex;gap:8px;align-items:center}
.rowc .rno{background:var(--ct);color:#fff;border:2px solid var(--ink);border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
label{display:block;font-size:12px;font-weight:700;margin-top:8px}
.lbl{font-size:12px;font-weight:700;margin-top:8px}
.row2{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.evs{margin:4px 0}
.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;border:var(--bw-s) solid var(--ink);border-radius:12px;padding:1px 8px;margin:1px 2px;background:var(--mint);color:#1e1e1e;font-size:12px;font-weight:400}.chip .ct{min-width:0;overflow-wrap:anywhere}
.chip.lost{background:var(--soft-r)}
.chip .x{background:none;border:0;box-shadow:none;padding:0 2px;cursor:pointer;color:#1e1e1e;font-size:12px}
.evc{margin:4px 0}.evc .src{font-size:11px;color:var(--muted);margin-left:6px}
.gap{background:var(--soft-r);border:var(--bw-s) solid var(--ink);border-radius:var(--r-m);padding:4px 10px;font-size:13px;margin-top:6px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.ai-badge{background:var(--soft-r);border:2px solid var(--ink);border-radius:99px;padding:0 8px;font-size:12px;font-weight:700}
.realc{border:var(--bw-s) solid var(--ink);border-radius:var(--r-m);padding:8px 10px;margin:10px 0}
.revc{border:var(--bw-s) dashed var(--ink);border-radius:var(--r-m);padding:6px 10px;margin:6px 0}
.ok{color:var(--ok);font-weight:700}.warn{color:var(--bad)}
.cnt{display:block;text-align:right;font-size:11px;color:var(--muted)}
.ck{display:inline-flex;align-items:center;gap:6px;font-weight:400}.ck input{width:auto}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}
#toast.on{opacity:1}
#coachFab{display:none;position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:24;min-height:56px;padding:0 18px;align-items:center;gap:6px;border-radius:99px;font-size:16px}
.only-m{display:none}

/* 原型工作台（③） */
.pt-mode{display:flex;gap:6px;margin:8px 0}.pt-m{flex:1;min-height:44px;border:2px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);font-weight:700;cursor:pointer}.pt-m.on{background:var(--ct,#3d6fe0);color:#fff;border-color:var(--ct,#3d6fe0)}
.pt-blk{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}.pt-h{font-weight:800;margin:6px 0}.pt-prog{font-weight:700;color:var(--muted)}
.pt-tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.pt-tool{text-align:left;min-height:56px;border:2px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);padding:8px 10px;cursor:pointer}.pt-tool.on{border-color:var(--ct,#3d6fe0)}.pt-tool b,.pt-tool span{display:block}.pt-tool span{font-size:13px;color:var(--muted)}
.pt-cards{display:grid;gap:6px;margin:8px 0}.pt-card{display:flex;gap:8px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;background:var(--panel)}.pt-card.on{border-color:var(--ct,#3d6fe0)}.pt-card input{width:24px;height:24px;flex:0 0 auto;margin-top:2px}.pt-card small{display:block;color:var(--muted)}
.pt-bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.pt-big{min-height:48px;padding:0 16px;border-radius:10px;border:0;background:var(--ct,#3d6fe0);color:#fff;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}.pt-big.g{background:var(--panel);color:var(--fg);border:2px solid var(--line)}
.pt-note{font-size:13px;color:var(--muted);margin:4px 0}.pt-heur{display:flex;gap:6px;flex-wrap:wrap}.pt-h1{min-height:44px;border:2px solid var(--line);border-radius:99px;background:var(--panel);color:var(--fg);padding:0 12px;cursor:pointer}.pt-h1.on{background:var(--ct,#3d6fe0);color:#fff;border-color:var(--ct,#3d6fe0)}
.pt-pre{margin:10px 0;padding:10px 14px;border:3px solid var(--ink,#111);border-radius:10px;background:#fff6cc;line-height:1.7}.pt-pre ul{margin:6px 0 0;padding-left:20px}.pt-pre a{font-weight:700}
.pt-miss{margin:8px 0;font-weight:700}.pt-miss.bad{color:var(--bad)}.pt-miss.ok{color:var(--ok)}.pt-ck{display:flex;gap:8px;align-items:center;min-height:44px}
.pt-h2{font-weight:700;margin:10px 0 4px}.pt-chip{display:inline-block;margin:2px 4px 0 0;padding:1px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:12px}
.pt-chip.got{background:var(--ct,#3d6fe0);color:#fff;border-color:var(--ct,#3d6fe0)}.pt-ach{margin:8px 0}.pt-vers{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
#lvBar{display:flex;gap:8px;align-items:center;margin-top:6px}#lvBar[hidden]{display:none}.pt-lbl{font-size:13px;color:var(--muted)}#lvBar .pt-mode{margin:0;flex:1;max-width:320px}
body.lv1 .dirbtn[data-k=mine],body.lv1 #nextLine~#progress{display:none}
body.lv1 #secProto .pt-mode{display:none}
#lvNav{margin:10px 0}
#ptText{width:100%;font-size:16px}
/* 五關進度條與 Figma→AI Studio 步驟助教（F⑩ figai_coach_ui.js，11-08） */
.pt-gates{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.pt-gate{flex:1 1 120px;min-height:48px;border:2px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);padding:6px 8px;text-align:left;cursor:pointer}.pt-gate.on{background:var(--ct,#3d6fe0);color:#fff;border-color:var(--ct,#3d6fe0)}.pt-gate b,.pt-gate span{display:block}.pt-gate span{font-size:13px}
#figaiBox{margin:12px 0}.fg-box{border:2px solid var(--line);border-radius:12px;background:var(--panel);padding:12px}.fg-h{font-weight:800;font-size:16px;margin:4px 0}.fg-h2{font-weight:700;margin:10px 0 4px}
.fg-steps{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.fg-steps button{min-height:48px;font-size:16px;border:2px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);padding:4px 10px;cursor:pointer}.fg-steps button.on{background:var(--ct,#3d6fe0);color:#fff;border-color:var(--ct,#3d6fe0)}.fg-steps small{display:block;font-size:12px}
.fg-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.fg-row button{min-height:48px;font-size:16px}.fg-l{display:block;font-weight:700;margin:8px 0 4px}
.fg-tag{display:inline-block;border:2px solid var(--line);border-radius:99px;padding:0 8px;font-size:12px;background:#e6f4ea}.fg-ai{background:#e6f4ea}
.fg-bub{border:2px solid var(--line);border-radius:10px;padding:6px 10px;margin:6px 0;font-size:16px;background:#fff}.fg-bub.warn{background:#fde8ec}
.fg-note{font-size:13px;color:var(--muted);margin:4px 0}.fg-ask{font-weight:700;margin:6px 0}.fg-muted{color:var(--muted)}
#figaiBox textarea{width:100%;font-size:16px}
@media (max-width:860px){
  html,body{overflow-x:hidden;max-width:100vw}
  body{font-size:16px}
  #top{position:static;padding:8px 10px}h1{font-size:18px}#modeTag{display:none}#top .line .btn.mini{flex:1 1 0;text-align:center;padding-left:4px;padding-right:4px}
  aside{position:static;max-height:none;overflow:visible}
  #layout{grid-template-columns:minmax(0,1fr);padding:8px;gap:10px}main{order:1;min-width:0}aside{order:2;min-width:0}
  button,.btn,select{min-height:44px}
  button.mini,.btn.mini{min-height:44px;padding:8px 12px;font-size:14px;margin:4px 0;min-width:44px}
  input,select,textarea{font-size:16px;min-height:44px}textarea{min-height:76px}
  .row2{grid-template-columns:minmax(0,1fr)}
  .ck input{width:24px;height:24px;min-height:24px}
  .chip .x{min-width:44px;min-height:44px;font-size:18px}
  #coachFab{display:flex}
  /* 浮動「助手」鈕固定在右下，會蓋到靠右的字數計數：計數改靠左，頁面底部多留一個按鈕高度，捲到底也不被壓住（11-01） */
  .cnt{text-align:left}
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  #coachBox{position:fixed;left:0;right:0;bottom:0;max-height:72vh;overflow:auto;z-index:25;margin:0;border-radius:16px 16px 0 0;border-bottom:0;transform:translateY(110%);transition:transform .22s;box-shadow:0 -6px 0 var(--ink);padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  body.coach-open #coachBox{transform:none}
  body.coach-open #coachFab{display:none}
  #coachBox .only-m{display:inline-block}
  #toast{bottom:84px;max-width:92vw}
}
</style>
</head>
<body>
<div id="gate"><div class="card"><h1>載入中…</h1></div></div>
<div id="app" hidden>
  <div id="top">
    <div class="line">
      <h1>提案室</h1><span class="muted">衛教簡訊再設計・呼呼醫院</span><span id="sidLine" class="muted"></span><span id="modeTag" class="muted"></span><span id="saved" class="muted"></span>
      <span style="flex:1"></span>
      <a id="sbLink" class="btn mini" href="storyboard.html">📖 故事板</a><a id="reviseLink" class="btn mini" href="index.html" title="回到急診室再問一個人">🩺 回訪談</a><a id="lobbyLink" class="btn mini" href="index.html">🏠 大廳</a>
    </div>
    <div id="nextLine" role="status" aria-live="polite">載入中…</div>
    <div id="progress"></div>
  </div>
  <div id="layout">
    <aside><div class="card" id="coachBox"></div></aside>
    <main id="main">
      <section class="card" id="secDir"></section>
      <section class="card" id="secRows">
        <h2>② 對準表：每一列是一個設計決定</h2>
        <div class="muted">每一列要回答：我決定什麼、依據是我哪一則紀錄、對應哪位人物、解決故事板哪一格、誰可能不同意、我取捨了什麼。依據找不到的列會標「指不回訪談」，可以直接回去問。</div>
        <div id="rows"></div>
        <p><button id="addRow">＋ 新增一列</button> <span class="muted" id="rowsInfo"></span></p>
      </section>
      <section class="card" id="secProto"></section>
      <section class="card" id="secWall"><h2>共同提案牆</h2><div class="muted">最多 4 位同學一起，把便利貼、證據、決定和原型貼在同一面牆上，互相留意見。新手可以先進去看，中級和專家可以貼卡、留意見、採納同學的意見。</div><p><a class="btn" id="wallLink" href="wall.html">🧱 到共同提案牆</a></p></section>
      <section class="card" id="secReal"></section>
      <section class="card" id="secExport"></section>
    </main>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<button id="coachFab" aria-label="開啟提案助手">🤖 助手</button>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script src="local_db.js?v=202611101618"></script>

<script src="sb_core.js?v=202611101618"></script>

<script src="proposal_core.js?v=202611101618"></script>
<script src="proposal_proto.js?v=202611101618"></script>
<script src="proposal_units_data.js?v=202611101618"></script>
<script src="proposal_units.js?v=202611101618"></script>
<script src="proposal_weekly.js?v=202611101618"></script>
<script src="proposal_store.js?v=202611101618"></script>

<script src="ui_level.js?v=202611101618"></script>
<script src="figai_coach.js?v=202611101618"></script>
<script src="figai_coach_ui.js?v=202611101618"></script>
<script src="proposal_proto_ui.js?v=202611101618"></script>

</body>
